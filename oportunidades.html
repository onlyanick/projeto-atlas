<!doctype html>
<html lang="pt-br">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-G8YT99YQ1N"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-G8YT99YQ1N");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Descubra oportunidades educacionais gratuitas, como intercâmbios, bolsas de estudos, cursos e outras iniciativas."
    />
    <title>Oportunidades - Projeto Atlas</title>
    <link rel="stylesheet" href="CSS/main.css" />
    <link rel="icon" type="image/png" href="/0Imagens/icon.png" />
    <script src="Oportunidades/oportunidadesjs.js" defer></script>
    <script src="main.js" defer></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

    <!-- FONTES -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Vend+Sans:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <!-- Vercel Web Analytics -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  </head>
  <body>
    <header><div id="header"></div></header>
    <aside>
      <div id="sidebar"></div>
    </aside>
    <main id="conteudo" tabindex="-1">
      <h2 class="headline">Oportunidades</h2>
      <p class="note">
        <i
          >(Todas as oportunidades listadas são gratuitas ou oferecem bolsas.
          Leia mais nas páginas individuais.)</i
        >
      </p>
      <form class="filtros" id="filtros" aria-label="Filtrar oportunidades">
        <div class="filtro">
          <span class="filtro-titulo" id="ano-titulo">Ano escolar</span>
          <details class="multi" id="ano">
            <summary aria-labelledby="ano-titulo"></summary>
            <div class="multi-opcoes" role="group" aria-labelledby="ano-titulo">
            <label><input type="checkbox" value="7EF" /> 7º ano (Ensino Fundamental)</label>
            <label><input type="checkbox" value="8EF" /> 8º ano (Ensino Fundamental)</label>
            <label><input type="checkbox" value="9EF" /> 9º ano (Ensino Fundamental)</label>
            <label><input type="checkbox" value="1EM" /> 1º ano (Ensino Médio)</label>
            <label><input type="checkbox" value="2EM" /> 2º ano (Ensino Médio)</label>
            <label><input type="checkbox" value="3EM" /> 3º ano (Ensino Médio)</label>
            <label><input type="checkbox" value="UNI" /> Universitário</label>
            </div>
          </details>
        </div>
        <div class="filtro">
          <span class="filtro-titulo" id="tipo-titulo">Tipo</span>
          <details class="multi" id="tipo">
            <summary aria-labelledby="tipo-titulo"></summary>
            <div class="multi-opcoes" role="group" aria-labelledby="tipo-titulo">
            <label><input type="checkbox" value="orientacao" /> Orientação</label>
            <label><input type="checkbox" value="bolsa-de-estudos" /> Bolsa de estudos</label>
            <label><input type="checkbox" value="cursos" /> Cursos</label>
            <label><input type="checkbox" value="internacional" /> Internacional</label>
            <label><input type="checkbox" value="pesquisa-cientifica" /> Pesquisa científica</label>
            <label><input type="checkbox" value="programacao" /> Programação</label>
            <label><input type="checkbox" value="moradia" /> Moradia</label>
            <label><input type="checkbox" value="curso-de-ferias" /> Curso de férias</label>
            <label><input type="checkbox" value="olimpiadas" /> Olimpíadas</label>
            </div>
          </details>
        </div>
        <button type="button" id="so-portugues" class="filtro-btn" aria-pressed="false">
          Apenas em português
        </button>
      </form>
      <p class="resultado" id="resultado" aria-live="polite"></p>
      <div class="container" id="cards-container"></div>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
